name: aereality
description: "AEReality 32-Bit HDR Node Grading Engine (Vulkan FFI)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.9.5
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - shaders/aereality_core.frag
    - assets/shaders/aereality_core.spv
