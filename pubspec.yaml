name: aereality
description: "AEReality 32-Bit HDR Node Grading Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.13.0
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  image: ^4.8.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.5.5   # <-- CORRECT PACKAGE

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/aereality_core.frag
