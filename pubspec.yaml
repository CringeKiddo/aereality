name: aereality
description: "AEReality 32-Bit HDR Node Grading Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ Required for Flutter GPU
  flutter_gpu:
    sdk: flutter
  
  video_player: ^2.9.5
  file_picker: ^8.1.7
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # ✅ Shaders are now in WGSL format – placed in assets
  assets:
    - shaders/aereality_core.wgsl
