name: shaderly
description: "Shaderly - High Performance Vulkan Compute & Master Export Suite"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Modern FFmpeg Kit Extended
  ffmpeg_kit_extended_flutter: ^0.6.2

  # Media playback & file picking
  video_player: ^2.8.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2

  # Frame encoding / decoding
  image: ^4.1.7

  # Native C++ Vulkan FFI bindings
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

ffmpeg_kit_extended_config:
  type: full

flutter:
  uses-material-design: true

  assets:
    - assets/shaders/
    - assets/models/
