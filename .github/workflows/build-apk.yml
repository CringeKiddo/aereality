name: Build AEReality APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install glslang and compile shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          mkdir -p assets/shaders
          glslangValidator -V shaders/aereality_core.comp -o assets/shaders/aereality_core.spv

      - name: Clean Gradle cache
        run: |
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf android/build
          rm -rf ~/.gradle/caches/

      - name: Ensure Android XML Resources & Themes Exist
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/launch_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black" />
          </layer-list>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00E5FF" />
          </shape>
          EOF

          cp android/app/src/main/res/drawable/ic_launcher.xml android/app/src/main/res/mipmap-hdpi/ic_launcher.xml
          cp android/app/src/main/res/drawable/ic_launcher.xml android/app/src/main/res/mipmap-mdpi/ic_launcher.xml
          cp android/app/src/main/res/drawable/ic_launcher.xml android/app/src/main/res/mipmap-xhdpi/ic_launcher.xml
          cp android/app/src/main/res/drawable/ic_launcher.xml android/app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
          cp android/app/src/main/res/drawable/ic_launcher.xml android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=VM_SERVICE_MAX_HEAP_SIZE=4096 --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aereality-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
