name: Build AEReality APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install glslang and compile shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          mkdir -p assets/shaders
          glslangValidator -V shaders/aereality_core.comp -o assets/shaders/aereality_core.spv

      - name: Clean Gradle cache
        run: |
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf android/build
          rm -rf ~/.gradle/caches/

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=VM_SERVICE_MAX_HEAP_SIZE=4096 --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aereality-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
