name: Build AEReality APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Generate Android project & add JitPack
        run: |
          # 1. Create the Android folder
          flutter create --platforms=android --org com.example .
          
          # 2. Restore YOUR custom files (so your main.dart doesn't get overwritten)
          git checkout -- lib/ shaders/ pubspec.yaml
          
          # 3. ADD JitPack to settings.gradle (this is the CORRECT file for newer Flutter)
          sed -i '/mavenCentral()/a \        maven { url "https://jitpack.io" }' android/settings.gradle

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aereality-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
